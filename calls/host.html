<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jamiu · Walkthrough host</title><link rel="stylesheet" href="/calls/call.css"><body class="call-host"><main><h1>Live walkthroughs</h1><p>Keep this page open to receive requests. Calls are accepted by you. Nothing is recorded.</p><section id="login"><form><label>Host password<input type="password" autocomplete="current-password" required></label><button>Sign in</button></form></section><section id="dashboard" hidden><button id="availability">Go available</button> <button id="logout">Sign out</button> <button id="notifications">Enable request notifications</button><p id="presence" role="status"></p><h2>Incoming requests</h2><div id="requests"></div></section><section id="active" hidden><h2>Live conversation</h2><div class="call-videos"><video data-remote autoplay playsinline></video><video data-local autoplay playsinline muted></video></div><p id="call-status" role="status"></p><div class="call-controls"><button data-audio>Mute microphone</button><button data-video>Turn camera off</button><button data-end>End call</button></div></section><section><button id="browse">Browse portfolio alongside the call</button><iframe id="portfolio" title="Portfolio during your live conversation" hidden style="width:100%;height:65vh;border:0"></iframe></section><p id="message" role="status"></p></main><script src="/calls/peer.js"></script><script>
'use strict';
const $=s=>document.querySelector(s),message=$('#message'),requests=$('#requests');let online=false,current=null,peer=null,cursor=0,polling=false,hostBusy=false,config={},knownRequests=new Set();
const say=m=>{message.textContent=m};
async function api(path,data){const r=await fetch('/calls-api'+path,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined,credentials:'same-origin'});const result=await r.json();if(!r.ok)throw Object.assign(Error(result.error),{status:r.status});return result;}
function stopLocal(){peer?.close();peer=null;current=null;cursor=0;$('#active').hidden=true;}
async function finish(){if(current)await api('/calls/'+current+'/end',{}).catch(()=>{});stopLocal();}
$('#login form').addEventListener('submit',async e=>{e.preventDefault();try{await api('/login',{password:$('#login input').value});$('#login input').value='';$('#login').hidden=true;$('#dashboard').hidden=false;say('');await refresh();}catch(e){say(e.message)}});
$('#notifications').onclick=async()=>{if(!('Notification' in window)){say('Desktop notifications are unavailable in this browser. Keep the dashboard visible.');return;}const permission=await Notification.requestPermission();say(permission==='granted'?'Request notifications enabled while this dashboard stays open.':'Notifications were not enabled. Requests still appear here.');};
$('#browse').onclick=()=>{$('#portfolio').hidden=false;$('#portfolio').src=config.portfolioUrl||'/calls/demo'};
$('#availability').onclick=async()=>{try{const r=await api('/availability',{online:!online});online=r.online;await refresh()}catch(e){say(e.message)}};
$('#logout').onclick=async()=>{await finish();await api('/logout',{});location.reload()};
$('[data-end]').onclick=finish;$('[data-audio]').onclick=()=>{if(peer)$('[data-audio]').textContent=peer.toggle('audio')?'Mute microphone':'Unmute microphone'};$('[data-video]').onclick=()=>{if(peer)$('[data-video]').textContent=peer.toggle('video')?'Turn camera off':'Turn camera on'};
async function accept(call){if(hostBusy||current)return;hostBusy=true;try{
 const candidate=new PortfolioPeer({role:'host',iceServers:config.iceServers||[],localVideo:$('[data-local]'),remoteVideo:$('[data-remote]'),send:m=>api('/calls/'+call.id+'/signal',{message:m}),onState:s=>{$('#call-status').textContent=s}});peer=candidate;
 await peer.start();await api('/calls/'+call.id+'/accept',{});current=call.id;cursor=0;$('#active').hidden=false;$('#call-status').textContent='Accepted. Waiting for the visitor to join…';say('');
}catch(e){stopLocal();say(e.name==='NotAllowedError'?'Camera or microphone permission was denied. The request has not been accepted.':e.message)}finally{hostBusy=false;await refresh()}}
async function refresh(){if(polling||$('#dashboard').hidden)return;polling=true;try{config=await api('/host');online=config.online;$('#availability').textContent=online?'Go unavailable':'Go available';$('#presence').textContent=online?'Available while this dashboard stays connected.':'Unavailable to visitors.';
 const waiting=config.calls.filter(c=>c.state==='waiting');document.title=waiting.length?'('+waiting.length+') Incoming walkthrough request':'Jamiu · Walkthrough host';for(const incoming of waiting){if(!knownRequests.has(incoming.id)){knownRequests.add(incoming.id);if('Notification' in window&&Notification.permission==='granted')new Notification('Portfolio walkthrough request',{body:incoming.name+' requested a live conversation.'});}}
 requests.replaceChildren();for(const call of config.calls.filter(c=>c.state==='waiting')){const row=document.createElement('div');row.className='request';const copy=document.createElement('div');copy.className='request-copy';const name=document.createElement('strong');name.textContent=call.name;const reason=document.createElement('small');reason.textContent=call.reason;copy.append(name,reason);const acceptButton=document.createElement('button');acceptButton.textContent='Accept';acceptButton.disabled=!!current||hostBusy;acceptButton.onclick=()=>accept(call);const decline=document.createElement('button');decline.textContent='Decline';decline.onclick=async()=>{await api('/calls/'+call.id+'/decline',{});await refresh()};row.append(copy,acceptButton,decline);requests.append(row)}
 if(!requests.children.length)requests.textContent='No waiting requests.';
 if(current){const state=await api('/calls/'+current+'?after='+cursor);if(state.state!=='accepted'){stopLocal();say('The call has ended.')}else for(const event of state.signals){await peer.receive(event.message);cursor=event.seq;}}
}catch(e){say(e.message);if(e.status===401){stopLocal();$('#dashboard').hidden=true;$('#login').hidden=false}}finally{polling=false}}
setInterval(refresh,800);window.addEventListener('pagehide',()=>peer?.close());api('/host').then(()=>{$('#login').hidden=true;$('#dashboard').hidden=false;refresh()}).catch(()=>{});
</script></body></html>
