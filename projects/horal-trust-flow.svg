<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Horal trust and seller operations flow</title><desc id="d">A visual flow from verified seller to protected payment, fulfilment, buyer confirmation and seller payout, alongside seller inventory and order tools.</desc><rect width="1600" height="900" fill="#f4f1eb"/><g font-family="Arial,Helvetica,sans-serif"><text x="90" y="98" font-size="26" font-weight="700" fill="#173b4f">Trust is a product flow, not a badge.</text><text x="90" y="135" font-size="16" fill="#66757d">The buyer and seller sides meet at one transaction lifecycle.</text><g transform="translate(90 230)"><rect width="250" height="170" rx="22" fill="#fff" stroke="#ccd4d8"/><circle cx="52" cy="54" r="26" fill="#173b4f"/><path d="M40 54l8 8 17-20" fill="none" stroke="#fff" stroke-width="5"/><text x="30" y="112" font-size="17" font-weight="700" fill="#273941">Verified seller</text><text x="30" y="139" font-size="12" fill="#76858c">KYC + store trust signals</text></g><path d="M355 315h95" stroke="#a5b0b5" stroke-width="3"/><path d="M435 303l18 12-18 12" fill="#a5b0b5"/><g transform="translate(465 230)"><rect width="250" height="170" rx="22" fill="#173b4f"/><text x="30" y="57" font-size="13" font-weight="700" fill="#cfe2ec">ESCROW</text><text x="30" y="94" font-size="19" font-weight="700" fill="#fff">Protected payment</text><text x="30" y="126" font-size="12" fill="#d8e5eb">Funds held while order moves</text></g><path d="M730 315h95" stroke="#a5b0b5" stroke-width="3"/><path d="M810 303l18 12-18 12" fill="#a5b0b5"/><g transform="translate(840 230)"><rect width="250" height="170" rx="22" fill="#fff" stroke="#ccd4d8"/><text x="30" y="57" font-size="13" font-weight="700" fill="#f47b20">ORDER</text><text x="30" y="94" font-size="19" font-weight="700" fill="#273941">Fulfilment</text><text x="30" y="126" font-size="12" fill="#76858c">Seller prepares and dispatches</text></g><path d="M1105 315h95" stroke="#a5b0b5" stroke-width="3"/><path d="M1185 303l18 12-18 12" fill="#a5b0b5"/><g transform="translate(1215 230)"><rect width="250" height="170" rx="22" fill="#fff" stroke="#ccd4d8"/><text x="30" y="57" font-size="13" font-weight="700" fill="#173b4f">CONFIRM</text><text x="30" y="94" font-size="19" font-weight="700" fill="#273941">Release payout</text><text x="30" y="126" font-size="12" fill="#76858c">Buyer confirms · seller paid</text></g><rect x="190" y="535" width="1220" height="190" rx="28" fill="#fff" stroke="#d2d8db"/><text x="230" y="584" font-size="14" font-weight="700" fill="#173b4f">SELLER OPERATIONS</text><rect x="230" y="618" width="245" height="65" rx="15" fill="#eef3f5"/><rect x="495" y="618" width="245" height="65" rx="15" fill="#eef3f5"/><rect x="760" y="618" width="245" height="65" rx="15" fill="#eef3f5"/><rect x="1025" y="618" width="245" height="65" rx="15" fill="#fff1e7"/><text x="260" y="657" font-size="13" font-weight="700" fill="#273941">Products + variants</text><text x="525" y="657" font-size="13" font-weight="700" fill="#273941">Orders + fulfilment</text><text x="790" y="657" font-size="13" font-weight="700" fill="#273941">Store + location</text><text x="1055" y="657" font-size="13" font-weight="700" fill="#9c551f">Wallet + earnings</text><text x="90" y="820" font-size="13" fill="#708087">Portfolio product-flow mockup based on the live Horal feature set.</text></g></svg>