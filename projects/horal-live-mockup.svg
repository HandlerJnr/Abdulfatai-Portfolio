<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Horal — live marketplace across mobile and web</title>
<desc id="desc">Editorial portfolio hero built directly around Horal's official App Store preview artwork, without adding another device mockup around it.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f7f9fb"/>
    <stop offset=".55" stop-color="#eef4f8"/>
    <stop offset="1" stop-color="#dce9f2"/>
  </linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#3da5f4" stop-opacity=".34"/>
    <stop offset="1" stop-color="#3da5f4" stop-opacity="0"/>
  </radialGradient>
  <filter id="lift" x="-40%" y="-40%" width="180%" height="190%">
    <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#0c3550" flood-opacity=".18"/>
  </filter>
</defs>

<rect width="1600" height="1000" fill="url(#paper)"/>
<circle cx="1438" cy="142" r="330" fill="url(#glow)"/>
<circle cx="1390" cy="880" r="420" fill="#0d4f7b" opacity=".055"/>

<!-- Editorial metadata -->
<g font-family="Arial,Helvetica,sans-serif">
  <text x="96" y="105" fill="#0d5b8d" font-size="18" font-weight="700" letter-spacing="3.1">LIVE PRODUCT · MARKETPLACE</text>
  <text x="96" y="245" fill="#102f43" font-size="112" font-weight="700" letter-spacing="-4">Horal</text>
  <text x="100" y="310" fill="#516875" font-size="27">End-to-end marketplace design across mobile and web.</text>

  <line x1="100" y1="380" x2="705" y2="380" stroke="#a9bac4" stroke-width="1"/>

  <text x="100" y="435" fill="#78909d" font-size="13" font-weight="700" letter-spacing="2">DESIGNED AROUND</text>
  <text x="100" y="492" fill="#17394d" font-size="23" font-weight="700">Buyer confidence</text>
  <text x="100" y="528" fill="#647b87" font-size="17">Verified sellers · clearer product discovery</text>

  <text x="100" y="605" fill="#17394d" font-size="23" font-weight="700">Protected transactions</text>
  <text x="100" y="641" fill="#647b87" font-size="17">Escrow · KYC · transaction visibility</text>

  <text x="100" y="718" fill="#17394d" font-size="23" font-weight="700">Seller operations</text>
  <text x="100" y="754" fill="#647b87" font-size="17">Inventory · orders · wallet · payouts</text>

  <rect x="100" y="833" width="246" height="55" rx="27.5" fill="#113d59"/>
  <text x="223" y="867" fill="#fff" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1.2">WEB · iOS · ANDROID</text>
</g>

<!-- Direct official App Store artwork; no extra phone/device frame -->
<g filter="url(#lift)">
  <rect x="925" y="86" width="505" height="828" rx="36" fill="#fff" opacity=".88"/>
  <image x="956" y="112" width="443" height="791" preserveAspectRatio="xMidYMid meet"
         href="data:image/webp;base64,"/>
</g>

<!-- Supporting editorial annotation around, not over, the official artwork -->
<g font-family="Arial,Helvetica,sans-serif">
  <rect x="780" y="205" width="182" height="72" rx="18" fill="#ffffff" opacity=".92"/>
  <text x="803" y="235" fill="#778b96" font-size="11" font-weight="700" letter-spacing="1.6">OFFICIAL STORE ART</text>
  <text x="803" y="258" fill="#16394e" font-size="15" font-weight="700">Real mobile product</text>

  <rect x="795" y="682" width="195" height="92" rx="20" fill="#0f4567"/>
  <text x="819" y="716" fill="#a8d4ee" font-size="11" font-weight="700" letter-spacing="1.5">TRUST MODEL</text>
  <text x="819" y="742" fill="#fff" font-size="16" font-weight="700">Escrow + verification</text>
  <text x="819" y="764" fill="#d4e7f2" font-size="12">Designed into the flow.</text>
</g>

<text x="96" y="950" font-family="Arial,Helvetica,sans-serif" fill="#81929b" font-size="13">
  Official Horal App Store preview artwork used as the primary visual proof.
</text>
</svg>